<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Test</title>
<style id="lcss"></style>
<style>
:root{--accent:#faaa6c;--accent-d:#e8924f;--bg:#faf7f2;--surface:#fff;--text:#2b2622;--grey:#6b625a;--border:#ddd3c6;--pass:#1f7a3d;--pass-bg:#e3f4e8;--fail:#b3261e;--fail-bg:#fbe5e3}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
a{color:var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--text);outline-offset:2px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:8px 14px;min-height:40px;transition:background-color 150ms,border-color 150ms}
.btn:hover{background:#f3ece2;border-color:#c9bcab}
.btn.primary,.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.top{flex:none;width:100%;max-width:1180px;margin:0 auto}
header{padding:20px 16px 4px;position:relative}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg .btn{border:0;border-radius:0;min-height:36px;padding:4px 14px;font-size:14px}
.seg .btn+.btn{border-left:1px solid var(--border)}
.lang{position:absolute;top:20px;right:16px}
h1{font-size:28px;line-height:1.25;margin:0 0 6px;padding-right:220px}
header p{margin:0}
.lead{font-weight:600}
.sub{color:var(--grey)}
.progress{padding:8px 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.bar{flex:1 1 220px;height:10px;background:#e9e1d5;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width 150ms}
.ptext{font-size:14px;color:var(--grey);white-space:nowrap}
.warn{padding:4px 16px;color:var(--fail);font-weight:600}
.warn[hidden]{display:none}
.layout{flex:1;min-height:0;width:100%;max-width:1180px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}
nav,main{overflow:auto;padding:16px 0 48px}
main{scroll-behavior:smooth}
#doc{max-width:75ch}
nav .nt{font-size:18px;font-weight:700;margin:0 0 8px}
nav .ng{font-size:16px;font-weight:700;margin:14px 0 4px}
nav a{display:flex;gap:6px;align-items:baseline;font-size:14px;color:var(--grey);text-decoration:none;padding:4px 8px;margin-left:12px;border-radius:6px;transition:background-color 150ms}
nav a:hover{background:#f0e8dc;color:var(--text)}
nav a.cur{background:var(--accent);color:var(--text);font-weight:600}
nav .mk{margin-left:auto;font-weight:700}
nav .mk.pass{color:var(--pass)}nav .mk.fail{color:var(--fail)}
h2{font-size:24px;font-weight:700;margin:40px 0 4px;padding-top:32px;border-top:1px solid var(--border);line-height:1.25}
#doc>h2:first-child{margin-top:0;padding-top:0;border-top:0}
.why{margin:0 0 12px;color:var(--grey)}
.setup ul{margin:8px 0 0;padding-left:20px}
.test{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin:14px 0;scroll-margin-top:8px}
.th{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
h3{font-size:16px;font-weight:600;margin:0;flex:1 1 240px}
.pf .btn[data-r="pass"][aria-pressed="true"]{background:var(--pass-bg);color:var(--pass)}
.pf .btn[data-r="fail"][aria-pressed="true"]{background:var(--fail-bg);color:var(--fail)}
.note{margin:8px 0 0;color:var(--grey);font-style:italic}
.steps{margin:10px 0 0;padding-left:24px}
.steps li{margin:6px 0}
.sc{font-weight:600}
.expect{margin:14px 0 0;padding:10px 14px;background:#f6efe3;border-left:3px solid var(--accent);border-radius:0 6px 6px 0}
.expect b{display:block;font-size:13px;font-weight:600;color:var(--grey);margin-bottom:2px}
.tn{display:block;width:100%;margin:12px 0 0;min-height:60px;font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);resize:vertical}
.tn[hidden]{display:none}
@media (max-width:820px){
 .layout{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:0}
 nav{max-height:112px;padding:8px 0}
 nav .nt,nav .ng{display:inline-block;margin:4px 8px 4px 0}
 nav a{display:inline-flex;margin:2px 4px 2px 0;background:#f0e8dc}
 h1{padding-right:0;margin-top:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{body{height:auto;overflow:visible;display:block}.lang,.progress,nav,.pf,.warn{display:none!important}.layout{display:block}main{overflow:visible}.test{break-inside:avoid}}
</style>
</head>
<body>
<div class="top">
 <header>
  <div class="lang seg" id="lang" role="group"></div>
  <h1 id="h1"></h1>
  <p class="lead" id="lead"></p>
  <p class="sub" id="rel"></p>
  <p class="sub" id="hint"></p>
 </header>
 <div class="progress">
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <span class="ptext" id="ptext"></span>
  <button class="btn primary" type="button" id="b-export"></button>
  <button class="btn" type="button" id="b-reset"></button>
 </div>
 <div class="warn" id="warn" hidden></div>
</div>
<div class="layout">
 <nav id="nav"></nav>
 <main id="main"><div id="doc"></div></main>
</div>

const sh=o=>LANGS.map(l=>{const t=tr(o,l.k),m=t.match(/^([^:：]{1,24}[:：])\s*([\s\S]*)$/);return'<span data-l="'+l.k+'">'+(m?'<b class="sc">'+esc(m[1])+"</b> "+esc(m[2]):esc(t))+"</span>"}).join("");
const ui=k=>bi(Object.fromEntries(LANGS.map(l=>[l.k,UI[l.k][k]])));
if(!DATA){document.body.innerHTML='<p style="padding:24px;font:16px/1.5 sans-serif">No guide data. Generate this page with the to-test-html skill.</p>';throw new Error("no DATA")}
const sig=(s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return(h>>>0).toString(36)})(JSON.stringify(DATA.groups));
const KEY="qa-"+DATA.ticket+"-"+sig;
let lang=LANGS[0].k,state={results:{},notes:{}},blocked=false;
const tests=[];
DATA.groups.forEach((g,gi)=>g.tests.forEach(t=>tests.push({id:"test-"+(tests.length+1),n:tests.length+1,g:gi,t:t})));
const lc=()=>LANGS.find(l=>l.k===lang).lc;
/* storage: localStorage, else window.name */
function load(){
 let raw=null;
 try{raw=localStorage.getItem(KEY)}catch(e){blocked=true}
 if(blocked){const p="QA:"+KEY+":";if(window.name.indexOf(p)===0)raw=window.name.slice(p.length)}
 if(raw){try{const s=JSON.parse(raw);if(s&&s.results)state={results:s.results,notes:s.notes||{}}}catch(e){}}
 let l=null;try{l=localStorage.getItem(KEY+":lang")}catch(e){}
 if(!LANGS.some(x=>x.k===l))l=(LANGS.find(x=>(navigator.language||"").indexOf(x.k)===0)||LANGS[0]).k;
 lang=l;
}
function save(){
 const raw=JSON.stringify(state);
 if(!blocked){try{localStorage.setItem(KEY,raw);return}catch(e){blocked=true}}
 window.name="QA:"+KEY+":"+raw;
 $("#warn").hidden=false;
}
/* build the page once; language switching only toggles visibility */
function build(){
 $("#h1").innerHTML=bi(DATA.title);
 $("#lead").innerHTML=(DATA.link?'<a href="'+esc(DATA.link)+'" target="_blank" rel="noopener noreferrer">'+esc(DATA.ticket)+"</a>":esc(DATA.ticket))+" "+ui("qa");
 if(DATA.related&&DATA.related.length)$("#rel").innerHTML=ui("rel")+" "+DATA.related.map(r=>(r.link?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener noreferrer">'+esc(r.key)+"</a>":esc(r.key))+(r.role?" ("+esc(r.role)+")":"")).join(" · ");
 $("#hint").innerHTML=ui("hint");
 $("#b-export").innerHTML=ui("exp");$("#b-reset").innerHTML=ui("reset");
 $("#warn").innerHTML=ui("warn");
 if(LANGS.length>1)$("#lang").innerHTML=LANGS.map(l=>'<button class="btn" type="button" data-lang="'+l.k+'">'+esc(l.name)+"</button>").join("");
 let nav='<p class="nt">'+ui("tests")+"</p>",doc="";
 if(DATA.setup&&DATA.setup.length){doc+='<section class="setup"><h2>'+ui("setup")+"</h2><ul>";
  DATA.setup.forEach(s=>{doc+="<li>"+bi(s.text)+"</li>"});
  doc+="</ul></section>"}
 DATA.groups.forEach((g,gi)=>{
  nav+='<p class="ng">'+bi(g.name)+"</p>";
  doc+="<h2>"+bi(g.name)+'</h2><p class="why">'+bi(g.why)+"</p>";
  tests.filter(x=>x.g===gi).forEach(x=>{
   const t=x.t;
   nav+='<a href="#'+x.id+'" data-id="'+x.id+'"><span>'+x.n+". "+bi(t.title)+'</span><span class="mk" data-mk="'+x.id+'"></span></a>';
   doc+='<article class="test" id="'+x.id+'"><div class="th"><h3>'+ui("test")+" "+x.n+": "+bi(t.title)+'</h3><div class="pf seg" role="group">'
    +["pass","fail"].map(r=>'<button type="button" class="btn" data-r="'+r+'" data-id="'+x.id+'" aria-pressed="false">'+ui(r)+"</button>").join("")+"</div></div>";
   if(t.note)doc+='<p class="note">'+bi(t.note)+"</p>";
   doc+='<ol class="steps">'+t.steps.map(s=>"<li>"+sh(s)+"</li>").join("")
    +'</ol><p class="expect"><b>'+ui("expect")+"</b>"+bi(t.expect)+'</p><textarea class="tn" data-note="'+x.id+'" rows="2" hidden></textarea></article>';
  });
 });
 $("#nav").innerHTML=nav;$("#doc").innerHTML=doc;
}
function counts(){
 let p=0,f=0;
 tests.forEach(x=>{const r=state.results[x.id];if(r==="pass")p++;else if(r==="fail")f++});
 return {p:p,f:f,u:tests.length-p-f};
}
function sync(){
 tests.forEach(x=>{
  const r=state.results[x.id];
  document.querySelectorAll('.pf button[data-id="'+x.id+'"]').forEach(b=>b.setAttribute("aria-pressed",String(r===b.dataset.r)));
  const m=document.querySelector('[data-mk="'+x.id+'"]');m.className="mk"+(r?" "+r:"");m.textContent=r==="pass"?"✓":r==="fail"?"✗":"";
 });
 document.querySelectorAll("textarea[data-note]").forEach(t=>{const v=state.notes[t.dataset.note]||"";if(t.value!==v)t.value=v;t.placeholder=UI[lang].note;t.setAttribute("aria-label",UI[lang].note);t.hidden=state.results[t.dataset.note]!=="fail"});
 const c=counts();
 $("#ptext").textContent=UI[lang].prog(c.p,c.f,c.u);
 $("#bar").style.width=(100*(c.p+c.f)/tests.length)+"%";
}
function setLang(l){
 lang=l;try{localStorage.setItem(KEY+":lang",l)}catch(e){}
 document.documentElement.lang=lc();
 $("#lcss").textContent='[data-l]:not([data-l="'+l+'"]){display:none}';
 document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===l)));
 document.title=UI[l].qa+" · "+tr(DATA.title,l)+" · "+DATA.ticket;
 $("#lang").setAttribute("aria-label",UI[l].lang);
 $("#nav").setAttribute("aria-label",UI[l].tests);
 sync();
}
/* Export a failed-test report as a PDF in the selected language. */
async function download(){
 const failed=tests.filter(x=>state.results[x.id]==="fail"),d=new Date(),p=n=>String(n).padStart(2,"0"),day=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
 const text=o=>esc(tr(o,lang)),label=k=>esc(UI[lang][k]);
 const holder=document.createElement("div");
 holder.style.cssText="position:fixed;left:-10000px;top:0;width:700px";
 const report=document.createElement("div");
 report.style.cssText="width:700px;background:#fff;color:#2b2622;font:16px/1.55 -apple-system,BlinkMacSystemFont,Segoe UI,Arial,PingFang TC,Microsoft JhengHei,sans-serif;padding:28px";
 const card=x=>'<article style="border:1px solid #ddd3c6;border-left:4px solid #b3261e;border-radius:8px;padding:14px 16px;margin:12px 0;break-inside:avoid;page-break-inside:avoid"><h3 style="font-size:16px;margin:0 0 6px">'+label("test")+' '+x.n+': '+text(x.t.title)+'</h3><ol style="padding-left:24px">'+x.t.steps.map(step=>'<li>'+text(step)+'</li>').join('')+'</ol><p style="padding:10px 14px;background:#f6efe3;border-left:3px solid #faaa6c"><b>'+label("expect")+'</b><br>'+text(x.t.expect)+'</p>'+((state.notes[x.id]||"").trim()?'<p style="padding:10px 14px;background:#fbe5e3"><b>'+label("tnote")+'</b><br>'+esc(state.notes[x.id].trim()).replace(/\n/g,"<br>")+'</p>':'')+'</article>';
 report.innerHTML='<h1 style="font-size:28px;margin:0;padding:0">'+text(DATA.title)+'</h1><p style="color:#6b625a">'+esc(DATA.ticket)+' · '+label("rep")+' · '+day+'</p><h2 style="font-size:22px;border-top:1px solid #ddd3c6;padding-top:20px">'+label("failed")+' ('+failed.length+')</h2>'+(failed.length?failed.map(card).join(''):'<p>'+label("none")+'</p>');
 holder.appendChild(report);document.body.appendChild(holder);
 const button=$("#b-export");button.disabled=true;
 try{
  if(!window.html2pdf){
   const bytes=Uint8Array.from(atob($("#pdf-library").textContent),c=>c.charCodeAt(0));
   const source=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
   const url=URL.createObjectURL(new Blob([source],{type:"text/javascript"}));
   try{await new Promise((resolve,reject)=>{const script=document.createElement("script");script.onload=resolve;script.onerror=reject;script.src=url;document.head.appendChild(script)})}finally{URL.revokeObjectURL(url)}
  }
  await html2pdf().set({margin:10,filename:DATA.ticket+"-qa-report-"+day+".pdf",image:{type:"jpeg",quality:0.98},html2canvas:{scale:2},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(report).save();
 }catch(e){alert(lang==="zh"?"無法匯出 PDF。請更新瀏覽器後再試。":"Could not export the PDF. Update your browser and try again.")}
 finally{button.disabled=false;holder.remove()}
}
/* nav highlight: main is the scroller */
let locked=false;
function setCur(id){document.querySelectorAll("nav a").forEach(a=>{const on=a.dataset.id===id;a.classList.toggle("cur",on);on?a.setAttribute("aria-current","true"):a.removeAttribute("aria-current")})}
function spy(){
 if(locked)return;
 const m=$("#main"),top=m.getBoundingClientRect().top,line=m.clientHeight*0.3;if(!tests.length)return;let id=tests[0].id;
 for(const x of tests)if(document.getElementById(x.id).getBoundingClientRect().top-top<=line)id=x.id;
 if(m.scrollTop+m.clientHeight>=m.scrollHeight-2)id=tests[tests.length-1].id;
 setCur(id);
}
function init(){
 load();build();setLang(lang);
 if(blocked)$("#warn").hidden=false;
 $("#lang").addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(b)setLang(b.dataset.lang)});
 $("#doc").addEventListener("click",e=>{
  const b=e.target.closest("button[data-r]");if(!b)return;
  const id=b.dataset.id;if(state.results[id]===b.dataset.r)delete state.results[id];else state.results[id]=b.dataset.r;
  save();sync();
 });
 $("#b-export").onclick=download;
 $("#nav").addEventListener("click",e=>{const a=e.target.closest("a[data-id]");if(!a)return;e.preventDefault();locked=true;setCur(a.dataset.id);document.getElementById(a.dataset.id).scrollIntoView({block:"start"})});
 ["wheel","touchstart","keydown"].forEach(ev=>window.addEventListener(ev,()=>{locked=false},{passive:true}));
 $("#main").addEventListener("scroll",spy,{passive:true});window.addEventListener("resize",spy);
 $("#doc").addEventListener("input",e=>{const id=e.target.dataset&&e.target.dataset.note;if(!id)return;if(e.target.value)state.notes[id]=e.target.value;else delete state.notes[id];save()});
 $("#b-reset").onclick=()=>{if(confirm(UI[lang].rc)){state={results:{},notes:{}};save();sync()}};
 spy();
}
init();
</script>
</body>
</html>
