<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="780" height="240" rx="12" fill="#faf7f2" stroke="#ddd3c6"/>
  <!-- Card 1: Dirty / Ready -->
  <g transform="translate(20, 20)">
    <rect width="230" height="200" rx="10" fill="#ffffff" stroke="#ddd3c6"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#6b625a">1. DIRTY (READY TO SAVE)</text>
    <text x="16" y="54" font-size="15" font-weight="600" fill="#2b2622">Profile Form</text>
    <rect x="16" y="68" width="198" height="32" rx="6" fill="#faf7f2" stroke="#c9bcab"/>
    <text x="26" y="89" font-size="13" fill="#2b2622">Name: Example User</text>
    <rect x="16" y="146" width="110" height="36" rx="8" fill="#faaa6c"/>
    <text x="54" y="169" font-size="14" font-weight="600" fill="#2b2622">Save</text>
  </g>
  <!-- Card 2: Saving (Pending) -->
  <g transform="translate(275, 20)">
    <rect width="230" height="200" rx="10" fill="#ffffff" stroke="#ddd3c6"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#b25e09">2. SAVING (LOCKED)</text>
    <text x="16" y="54" font-size="15" font-weight="600" fill="#2b2622">Profile Form</text>
    <rect x="16" y="68" width="198" height="32" rx="6" fill="#f3ece2" stroke="#ddd3c6"/>
    <text x="26" y="89" font-size="13" fill="#6b625a">Name: Example User</text>
    <rect x="16" y="146" width="130" height="36" rx="8" fill="#e9e1d5" stroke="#ddd3c6"/>
    <text x="36" y="169" font-size="14" font-weight="600" fill="#6b625a">Saving...</text>
  </g>
  <!-- Card 3: SaveError (Retry enabled) -->
  <g transform="translate(530, 20)">
    <rect width="230" height="200" rx="10" fill="#ffffff" stroke="#b3261e"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#b3261e">3. ERROR (RETRY ENABLED)</text>
    <text x="16" y="54" font-size="15" font-weight="600" fill="#2b2622">Profile Form</text>
    <rect x="16" y="68" width="198" height="32" rx="6" fill="#faf7f2" stroke="#c9bcab"/>
    <text x="26" y="89" font-size="13" fill="#2b2622">Name: Example User</text>
    <rect x="16" y="108" width="198" height="26" rx="5" fill="#fbe5e3"/>
    <text x="24" y="125" font-size="12" font-weight="600" fill="#b3261e">Save failed. Try again.</text>
    <rect x="16" y="146" width="110" height="36" rx="8" fill="#faaa6c"/>
    <text x="54" y="169" font-size="14" font-weight="600" fill="#2b2622">Save</text>
  </g>
</svg>
